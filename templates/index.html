<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 60px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 90%;
            padding: 15px;
            margin: 20px 0;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Emotion Detector</h1>

        <p>Enter a sentence and detect its emotions.</p>

        <textarea
            id="textToAnalyze"
            rows="5"
            placeholder="Enter your text here..."
        ></textarea>

        <br>

        <button onclick="detectEmotion()">
            Analyze Emotion
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function detectEmotion() {
            const text = document
                .getElementById("textToAnalyze")
                .value;

            const result = document.getElementById("result");

            if (!text.trim()) {
                result.innerHTML =
                    "Please enter some text to analyze.";
                return;
            }

            try {
                const response = await fetch(
                    `/emotionDetector?textToAnalyze=${encodeURIComponent(text)}`
                );

                const data = await response.text();

                result.innerHTML = data;
            } catch (error) {
                result.innerHTML =
                    "An error occurred while contacting the server.";
            }
        }
    </script>
</body>
</html>
